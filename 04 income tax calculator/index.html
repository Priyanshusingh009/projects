<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Income Tax Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient floating money picture cards -->
  <div class="floating-badge badge-top-left" aria-hidden="true">
    <img src="assets/gold_coins.jpg" alt="Gold Coins Stack">
    <div class="badge-glow"></div>
  </div>
  <div class="floating-badge badge-bottom-right" aria-hidden="true">
    <img src="assets/money_vault.jpg" alt="Finance Vault">
    <div class="badge-glow"></div>
  </div>

  <div id="parent">
    <!-- Hero 3D Money Picture Badge -->
    <div class="hero-image-wrapper">
      <div class="glow-pulse"></div>
      <img src="assets/money_vault.jpg" alt="Tax Vault" class="hero-img">
    </div>

    <h1>Tax Calculator</h1>
    <p class="subtitle">Fast, accurate & intelligent tax computation</p>

    <form>
      <div class="input-group">
        <label for="income">Enter your annual income</label>
        <div class="input-wrapper">
          <span class="currency-symbol">₹</span>
          <input type="number" id="income" placeholder="e.g. 15,00,000" required min="0" step="any">
        </div>
      </div>
      <button type="submit" id="calculate-btn">
        <span>Calculate Tax</span>
        <svg class="btn-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </form>

    <div id="result-box">
      <h2 id="result"></h2>
      <div id="tax-details" class="tax-details"></div>
    </div>
  </div>

  <!-- Animated Flying Money Particles Container -->
  <div id="coin-particles" aria-hidden="true"></div>

  <script src="first.js"></script>
</body>
</html>
