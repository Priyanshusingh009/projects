<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A sleek, modern digital clock featuring focus countdown timers and an interactive task manager.">
  <title>AuraClock — Digital Clock, Timer & Tasks</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <div class="app-container">
    <!-- Navigation / Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </div>
        <span class="brand-name">Aura<span>Clock</span></span>
      </div>

      <div class="header-controls">
        <button id="format-toggle" class="btn-toggle" title="Toggle 12h/24h format">
          <span class="toggle-indicator">24H</span>
        </button>
      </div>
    </header>

    <!-- Main Clock Hero Section -->
    <main>
      <section class="clock-hero-card" aria-label="Current Digital Clock">
        <div class="greeting-badge" id="greeting-text">Good day • Ready to focus</div>
        
        <!-- Main digital clock display -->
        <div class="clock-display-wrap">
          <div id="time" class="clock-time">
            <span id="hours">00</span>
            <span class="colon">:</span>
            <span id="minutes">00</span>
            <span class="colon">:</span>
            <span id="seconds">00</span>
          </div>
          <span id="ampm" class="ampm-pill">AM</span>
        </div>

        <div class="date-display" id="date-text">Loading date...</div>
      </section>

      <!-- Productivity Dashboard Grid: Timer & Tasks -->
      <section class="dashboard-grid">
        
        <!-- Timer Card -->
        <article class="dashboard-card timer-card">
          <div class="card-header">
            <div class="card-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="6" x2="12" y2="10"></line>
                <line x1="12" y1="12" x2="16" y2="14"></line>
              </svg>
              <h2>Focus Timer</h2>
            </div>
            <span id="timer-status-badge" class="status-badge">Idle</span>
          </div>

          <!-- Preset Selection -->
          <div class="timer-presets" role="group" aria-label="Timer presets">
            <button class="preset-btn active" data-time="1500">25m Focus</button>
            <button class="preset-btn" data-time="300">5m Break</button>
            <button class="preset-btn" data-time="900">15m Long</button>
            <button class="preset-btn" id="custom-preset-btn">Custom</button>
          </div>

          <!-- Custom Time Input Drawer (hidden by default) -->
          <div class="custom-timer-drawer hidden" id="custom-timer-drawer">
            <div class="custom-input-group">
              <label for="custom-minutes">Minutes</label>
              <input type="number" id="custom-minutes" min="1" max="180" value="10" placeholder="10">
            </div>
            <button id="set-custom-btn" class="btn-primary-small">Set</button>
          </div>

          <!-- Timer Visualizer -->
          <div class="timer-display-wrapper">
            <svg class="timer-ring-svg" viewBox="0 0 160 160">
              <circle class="ring-bg" cx="80" cy="80" r="72"></circle>
              <circle class="ring-progress" id="timer-progress-ring" cx="80" cy="80" r="72"></circle>
            </svg>
            <div class="timer-digits-container">
              <div class="timer-digits" id="timer-display">25:00</div>
              <span class="timer-sublabel" id="timer-sublabel">Focus Session</span>
            </div>
          </div>

          <!-- Timer Controls -->
          <div class="timer-actions">
            <button id="timer-start-btn" class="btn-action btn-start">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span>Start</span>
            </button>
            <button id="timer-reset-btn" class="btn-action btn-reset" title="Reset Timer">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <polyline points="3 3 3 8 8 8"></polyline>
              </svg>
              <span>Reset</span>
            </button>
          </div>
        </article>

        <!-- Tasks Card -->
        <article class="dashboard-card tasks-card">
          <div class="card-header">
            <div class="card-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
              </svg>
              <h2>Focus Tasks</h2>
            </div>
            <span id="task-counter" class="status-badge badge-accent">0 / 0</span>
          </div>

          <!-- Add Task Form -->
          <form id="task-form" class="task-input-bar">
            <input 
              type="text" 
              id="task-input" 
              placeholder="What are you working on next?" 
              autocomplete="off" 
              required
            >
            <button type="submit" id="add-task-btn" class="btn-add-task" aria-label="Add Task">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add</span>
            </button>
          </form>

          <!-- Task Filter Tabs -->
          <div class="task-filters">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="active">Active</button>
            <button class="filter-tab" data-filter="completed">Done</button>
          </div>

          <!-- Task List -->
          <div class="task-list-wrapper">
            <ul id="task-list" class="task-list" aria-live="polite">
              <!-- Dynamically populated tasks will go here -->
            </ul>
            <div id="empty-tasks-state" class="empty-state">
              <div class="empty-icon">🌱</div>
              <p>No tasks yet! Add one above to kickstart your focus.</p>
            </div>
          </div>

          <!-- Task Footer -->
          <div class="task-footer">
            <span id="tasks-left-msg">0 pending</span>
            <button id="clear-completed-btn" class="btn-link">Clear completed</button>
          </div>
        </article>

      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>AuraClock • Stay Productive & Mindful</p>
    </footer>
  </div>

  <script src="first.js"></script>
</body>
</html>
