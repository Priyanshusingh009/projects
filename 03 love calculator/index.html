<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Love Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #880e4f, #2a081a);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
            position: relative;
        }

        #parent {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            padding: 35px 30px;
            width: 90%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 30px rgba(233, 30, 99, 0.3);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin-bottom: 25px;
            color: #ff80ab;
            text-shadow: 0 0 15px rgba(255, 128, 171, 0.6);
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            color: #f8bbd0;
            margin-bottom: 6px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #ff4081;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 12px rgba(255, 64, 129, 0.5);
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #ff4081, #c2185b);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(233, 30, 99, 0.6);
            background: linear-gradient(135deg, #ff80ab, #e91e63);
        }

        button:active {
            transform: translateY(1px);
        }

        #heart-loader {
            display: none;
            font-size: 3rem;
            margin: 20px 0 10px;
            animation: pulseBeat 0.7s infinite alternate;
        }

        @keyframes pulseBeat {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.3) drop-shadow(0 0 15px #ff4081); }
        }

        h2 {
            margin-top: 25px;
            font-size: 1.25rem;
            color: #ffebee;
            min-height: 40px;
            transition: all 0.3s ease;
        }

        .highlight-result {
            font-size: 1.6rem;
            font-weight: 700;
            color: #ff4081;
            text-shadow: 0 0 15px rgba(255, 64, 129, 0.7);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Floating heart particles */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            font-size: 1.5rem;
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.8) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5) rotate(45deg);
                opacity: 0;
            }
        }

        /* 99% Glittering Hearts Celebration Animation */
        .glitter-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            user-select: none;
            font-size: 1.8rem;
            animation: glitterBurst 2.4s cubic-bezier(0.12, 0.8, 0.32, 1) forwards, sparkle 0.5s infinite alternate;
        }

        @keyframes glitterBurst {
            0% {
                transform: translate(0, 0) scale(0.2) rotate(0deg);
                opacity: 1;
            }
            40% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(var(--scale)) rotate(var(--rot));
                opacity: 0;
            }
        }

        @keyframes sparkle {
            0% {
                filter: drop-shadow(0 0 6px #ff4081) drop-shadow(0 0 12px #ff80ab) brightness(1.1);
            }
            100% {
                filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 25px #ff4081) brightness(1.8);
            }
        }
    </style>
</head>

<body>
    <div id="parent">
        <h1>THE LOVE CALCULATOR</h1>
        <form>
            <div class="input-group">
                <label for="boy">BOY'S NAME</label>
                <input type="text" id="boy" name="boy" placeholder="Enter boy's name" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="girl">GIRL'S NAME</label>
                <input type="text" id="girl" name="girl" placeholder="Enter girl's name" required autocomplete="off">
            </div>

            <button type="submit" id="calc-btn">Calculate Love</button>
        </form>

        <div id="heart-loader">❤️</div>
        <h2 id="result-text">Enter names to calculate</h2>
    </div>

    <script src="first.js"></script>
</body>

</html>
